---
source_url:                     'https://apt.armbian.com'
source_suites:                  
  - "{{ os_release_name }}"
source_components:
  - 'main'
  - "{{ os_release_name }}-utils"
  - "{{ os_release_name }}-desktop"
# Armbian, unlike debian, does not control this file with a package, but it
# should come with the OS image.
keyring_file:                   '/usr/share/keyrings/armbian-archive-keyring.gpg'
remove_files:
  - '/etc/sources.list.d/armbian.sources'
template_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/sources.list.d/armbian_sources.j2'
    dest:                       "/etc/apt/sources.list.d/armbian_{{ os_release_name }}.sources"
